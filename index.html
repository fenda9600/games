<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游戏大厅</title>
<meta name="description" content="浏览器小游戏合集，打开即玩。">
<style>
:root{
  --bg:#060814;--card:#0f1426;--line:rgba(130,160,255,.18);--text:#e9eeff;--dim:#8e98bb;--accent:#6fe3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
body{background:
  radial-gradient(1200px 600px at 85% -10%,rgba(123,63,228,.25),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(52,140,255,.18),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:1160px;width:100%;margin:0 auto;padding:40px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#6fe3ff,#b76bff,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:14px;margin-top:6px;letter-spacing:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
  font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 14px 40px -12px color-mix(in srgb,var(--c) 55%,transparent)}
.cover{aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;font-size:64px;
  background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),#10152b 75%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.new{position:absolute;top:12px;left:12px;background:#ff4d8d;color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;letter-spacing:1px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:21px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.title small{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1px}
.desc{font-size:14px;color:#bfc7e6;line-height:1.6;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:#c9d1f0}
.play{font-size:14px;font-weight:900;color:var(--c)}
.ctl{font-size:12px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:60px 0}
footer{margin-top:40px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>游戏大厅</h1><div class="sub" id="count">打开即玩 · 无需下载</div></div>
    <div class="tools" id="filters"></div>
  </header>
  <main class="grid" id="grid"><div class="empty">加载中…</div></main>
  <footer>游戏进度保存在你的浏览器中</footer>
</div>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let games = [], tag = '全部';

function render() {
  const list = tag === '全部' ? games : games.filter(g => (g.tags || []).includes(tag));
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = '<div class="empty">暂无游戏</div>'; return; }
  const now = Date.now();
  grid.innerHTML = list.map(g => {
    const isNew = g.added && now - new Date(g.added).getTime() < 14 * 864e5;
    const accent = /^#[0-9a-f]{3,8}$/i.test(g.accent || '') ? g.accent : '#6fe3ff';
    return `<a class="card" href="${esc(g.path)}" style="--c:${accent}">
      <div class="cover">${esc(g.icon || '🎮')}${g.cover ? `<img src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${isNew ? '<span class="new">NEW</span>' : ''}</div>
      <div class="body">
        <div class="title">${esc(g.title)}${g.subtitle ? `<small>${esc(g.subtitle)}</small>` : ''}</div>
        <div class="desc">${esc(g.description)}</div>
        <div class="meta"><div class="tags">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div><span class="play">开始游戏 →</span></div>
        ${g.controls ? `<div class="ctl">操作：${esc(g.controls)}</div>` : ''}
      </div></a>`;
  }).join('');
}

function renderFilters() {
  const tags = ['全部', ...new Set(games.flatMap(g => g.tags || []))];
  const box = document.getElementById('filters');
  if (games.length < 3) { box.innerHTML = ''; return; }
  box.innerHTML = tags.map(t => `<button class="chip ${t === tag ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { tag = b.dataset.t; renderFilters(); render(); });
}

fetch('/games.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    games = (d.games || []).slice().sort((a, b) => String(b.added || '').localeCompare(String(a.added || '')));
    document.getElementById('count').textContent = `共 ${games.length} 款游戏 · 打开即玩 · 无需下载`;
    renderFilters(); render();
  })
  .catch(() => { document.getElementById('grid').innerHTML = '<div class="empty">游戏列表加载失败，请刷新重试</div>'; });
</script>
</body>
</html>
