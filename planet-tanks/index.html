<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星际战车</title>
<meta name="description" content="星际战车：在不同星球上驾驶战车一对一对决，赢取金币与钻石，升级装备，解锁新星球。">
<style>
:root{
  --bg:#05060d;--panel:rgba(14,18,34,.92);--line:rgba(120,160,255,.22);
  --text:#e8edff;--dim:#8d97b8;--gold:#ffc83d;--dia:#6fe3ff;--hi:#b76bff;
  --ok:#3ddc84;--bad:#ff5a5a;--accent:#4da3ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.screen{position:fixed;inset:0;display:none;overflow-y:auto;padding:16px;z-index:5}
.screen.show{display:block}
.wrap{max-width:1160px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-size:28px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#6fe3ff,#b76bff,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1;min-width:180px}
.logo small{display:block;font-size:11px;letter-spacing:5px;color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:600}
.money{display:flex;gap:10px}
.coin{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.coin.g{color:var(--gold)}.coin.d{color:var(--dia)}
.btn{padding:10px 20px;border-radius:12px;font-weight:800;background:linear-gradient(180deg,#3f8cff,#2a5fd6);box-shadow:0 4px 0 #1a3d8f,0 0 20px rgba(77,163,255,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a3d8f}
.btn.alt{background:linear-gradient(180deg,#39405c,#262b40);box-shadow:0 4px 0 #141726}
.btn.gold{background:linear-gradient(180deg,#ffcf4d,#e09a12);color:#3a2500;box-shadow:0 4px 0 #8f5f00}
.btn.dia{background:linear-gradient(180deg,#b88cff,#7b3fe4);box-shadow:0 4px 0 #4a1f99,0 0 18px rgba(183,107,255,.35)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
h2{font-size:18px;margin:6px 0 12px;color:var(--dim);font-weight:700;letter-spacing:1px}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-3px);border-color:rgba(160,190,255,.6)}
.pcard.locked{cursor:not-allowed;opacity:.5}
.pcard.locked:hover{transform:none}
.sphere{width:74px;height:74px;border-radius:50%;float:right;margin:-2px -2px 6px 10px;box-shadow:inset -14px -10px 24px rgba(0,0,0,.65),0 0 26px rgba(255,255,255,.12)}
.pcard .lv{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1px}
.pcard .nm{font-size:22px;font-weight:900;margin:2px 0}
.pcard .sub{font-size:12px;color:var(--dim)}
.pcard .desc{clear:both;font-size:13px;color:#c4cbe6;margin-top:8px;min-height:36px}
.pcard .foe{font-size:12px;color:var(--dim);margin-top:8px;display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:800;margin-top:10px}
.tag.done{background:rgba(61,220,132,.15);color:var(--ok)}
.tag.next{background:rgba(255,200,61,.18);color:var(--gold);animation:pulse 1.4s infinite}
.tag.lock{background:rgba(255,255,255,.08);color:var(--dim)}
@keyframes pulse{50%{opacity:.55}}
.help{margin-top:18px;font-size:13px;color:var(--dim);line-height:1.8;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.help b{color:var(--text)}
.link{color:var(--dim);font-size:12px;text-decoration:underline;margin-top:10px}
/* garage */
.garage{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:760px){.garage{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
#preview{width:100%;height:190px;display:block;border-radius:12px;background:radial-gradient(circle at 50% 60%,#1d2745,#0a0d18)}
.stats{margin-top:10px;font-size:14px}
.stats div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed rgba(255,255,255,.07)}
.stats span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800;color:var(--dim)}
.tab.on{background:var(--accent);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:6px;position:relative}
.item.hi{border-color:rgba(183,107,255,.55);background:linear-gradient(160deg,rgba(183,107,255,.14),rgba(111,227,255,.05));box-shadow:0 0 18px rgba(183,107,255,.15)}
.item.eq{outline:2px solid var(--ok)}
.item.lk{opacity:.45}
.item .t{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.item .grade{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:800}
.grade.n{background:rgba(255,200,61,.18);color:var(--gold)}
.grade.h{background:rgba(183,107,255,.25);color:#e2c6ff}
.item .s{font-size:12px;color:#b9c2e3;line-height:1.6;flex:1}
.item .btn{padding:8px 10px;font-size:14px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);background:var(--panel);border:1px solid var(--line);padding:10px 20px;border-radius:12px;font-weight:800;z-index:50;transition:transform .25s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
#hud.show{display:block}
.bars{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hpbox{width:min(36vw,320px)}
.hpbox .n{font-size:13px;font-weight:800;margin-bottom:4px;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between}
.hp{height:14px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative}
.hp i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
.hp .lag{background:rgba(255,255,255,.5);transition:transform .6s .15s}
#phpbar{background:linear-gradient(90deg,#26c281,#6ff5b0)}
#ehpbar{background:linear-gradient(90deg,#ff4b4b,#ff9a5a)}
#ehp .hp i{transform-origin:right}
#ehp{text-align:right}
.center{text-align:center;text-shadow:0 1px 4px #000}
.center .pl{font-size:18px;font-weight:900}
.center .ef{font-size:12px;color:#c8d0ee}
#lootc{margin-top:4px;font-weight:900;font-size:15px}
#skillbox{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}
.sk{min-width:62px;height:62px;border-radius:14px;background:rgba(10,14,28,.8);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:12px;font-weight:800;padding:0 8px}
.sk b{font-size:10px;color:var(--dim)}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);transform-origin:bottom}
#pausebtn{position:absolute;top:58px;left:12px;pointer-events:auto;font-size:13px;padding:5px 10px;border-radius:8px;background:rgba(10,14,28,.7);border:1px solid var(--line)}
/* touch */
#touch{position:fixed;inset:0;z-index:3;display:none}
#touch.show{display:block}
#tl,#tr{position:absolute;top:90px;bottom:0;width:50%}
#tl{left:0}#tr{right:0}
.tbtn{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(77,163,255,.22);border:2px solid rgba(160,200,255,.5);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:4}
#tskill{right:26px;bottom:150px}
#tdash{right:120px;bottom:190px;width:60px;height:60px;font-size:12px}
/* result */
.modal{max-width:520px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h1{font-size:44px;font-weight:900;letter-spacing:6px}
.modal h1.win{background:linear-gradient(180deg,#fff3b0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal h1.lose{color:var(--bad)}
.rewards{display:flex;justify-content:center;gap:14px;margin:18px 0}
.rw{background:rgba(0,0,0,.3);border-radius:14px;padding:12px 20px;min-width:120px}
.rw .v{font-size:28px;font-weight:900}
.rw.g .v{color:var(--gold)}.rw.d .v{color:var(--dia)}
.rw .k{font-size:12px;color:var(--dim)}
.unlocks{text-align:left;font-size:14px;line-height:1.9;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.unlocks:empty{display:none}
.unlocks .u{color:var(--ok);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 星图 -->
<div id="map" class="screen">
  <div class="wrap">
    <div class="topbar">
      <div class="logo">星际战车<small>PLANET TANKS</small></div>
      <div class="money"><div class="coin g">🪙 <span class="vg">0</span></div><div class="coin d">💎 <span class="vd">0</span></div></div>
      <button class="btn gold" id="toGarage">🔧 车库</button>
      <a class="btn alt" href="/" style="text-decoration:none;color:inherit">🏠 大厅</a>
    </div>
    <h2>选择星球 · 击败守卫以解锁下一颗星球与新装备</h2>
    <div class="planets" id="planets"></div>
    <div class="help">
      <b>操作</b>：WASD / 方向键 移动 · 鼠标瞄准，按住左键开火 · <b>E / 空格</b> 释放模块技能 · <b>Shift</b> 冲刺（需曲速引擎）· <b>Esc</b> 暂停<br>
      手机：左半屏摇杆移动，右半屏摇杆瞄准并自动开火。<br>
      <b>经济</b>：每场胜利都会爆出 🪙金币 和 💎钻石，靠近即可拾取。金币只能购买普通装备，钻石可购买高端装备。首次通关有额外奖励。
      <div><button class="link" id="reset">重置存档</button></div>
    </div>
  </div>
</div>

<!-- 车库 -->
<div id="garage" class="screen">
  <div class="wrap">
    <div class="topbar">
      <div class="logo">车库<small>GARAGE</small></div>
      <div class="money"><div class="coin g">🪙 <span class="vg">0</span></div><div class="coin d">💎 <span class="vd">0</span></div></div>
      <button class="btn alt" id="backMap">← 星图</button>
    </div>
    <div class="garage">
      <div class="panel">
        <canvas id="preview" width="600" height="380"></canvas>
        <div class="stats" id="stats"></div>
      </div>
      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div class="items" id="items"></div>
      </div>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="bars">
    <div class="hpbox" id="php"><div class="n"><span>你的战车</span><span id="phpt"></span></div><div class="hp"><i class="lag" id="phplag"></i><i id="phpbar"></i></div></div>
    <div class="center"><div class="pl" id="hudPlanet"></div><div class="ef" id="hudEffect"></div><div id="lootc"></div></div>
    <div class="hpbox" id="ehp"><div class="n"><span id="ehpt"></span><span id="ename"></span></div><div class="hp"><i class="lag" id="ehplag"></i><i id="ehpbar"></i></div></div>
  </div>
  <button id="pausebtn">⏸ 暂停</button>
  <div id="skillbox"></div>
</div>

<div id="touch"><div id="tl"></div><div id="tr"></div><button class="tbtn" id="tskill">技能</button><button class="tbtn" id="tdash">冲刺</button></div>

<!-- 暂停 -->
<div id="pause" class="screen">
  <div class="modal"><h1 style="font-size:34px">暂停</h1>
    <p style="color:var(--dim);margin:12px 0 20px">撤退将不会获得任何奖励</p>
    <div class="row"><button class="btn" id="resume">继续战斗</button><button class="btn alt" id="quit">撤退</button></div>
  </div>
</div>

<!-- 结算 -->
<div id="result" class="screen">
  <div class="modal">
    <h1 id="rTitle"></h1>
    <p id="rSub" style="color:var(--dim);margin-top:6px"></p>
    <div class="rewards"><div class="rw g"><div class="v" id="rGold">0</div><div class="k">🪙 金币</div></div><div class="rw d"><div class="v" id="rDia">0</div><div class="k">💎 钻石</div></div></div>
    <div class="unlocks" id="rUnlocks"></div>
    <div class="row"><button class="btn" id="rNext"></button><button class="btn gold" id="rGarage">🔧 车库</button><button class="btn alt" id="rMap">星图</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ================= 基础 ================= */
const $ = s => document.querySelector(s);
const cvs = $('#game'), ctx = cvs.getContext('2d');
const W = 1800, H = 1150;           // 竞技场尺寸
let DPR = 1, VW = 0, VH = 0, SC = 1; // SC: 世界 -> 屏幕缩放
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cvs.width = VW * DPR; cvs.height = VH * DPR;
  cvs.style.width = VW + 'px'; cvs.style.height = VH + 'px';
  SC = Math.max(0.5, Math.min(VW / 1150, VH / 720));
}
addEventListener('resize', resize); resize();

/* ================= 数据 ================= */
const PLANETS = [
  { name: '地球', sub: '训练基地', enemy: '铁锈巡逻车', ecol: '#c0392b', sphere: ['#6fc3ff', '#1b5e20'], ground: ['#3f6d34', '#4f8440', '#2f5527'], space: '#0b1a2a', obs: 'rock', oc: ['#8b8577', '#5d584d'], deco: 'grass', effect: null, desc: '温和的训练场，适合熟悉操作。' },
  { name: '月球', sub: '静海基地', enemy: '环形山猎手', ecol: '#7f8c8d', sphere: ['#f0f0f0', '#555'], ground: ['#8d8d93', '#a3a3a8', '#76767c'], space: '#05070d', obs: 'rock', oc: ['#b5b5ba', '#6d6d72'], deco: 'craters', effect: 'moon', desc: '低重力：车辆惯性更大，刹车变慢。' },
  { name: '火星', sub: '奥林匹斯荒原', enemy: '红沙掠夺者', ecol: '#e67e22', sphere: ['#ff9a5a', '#8a2c0f'], ground: ['#b5552b', '#c8683a', '#9c4522'], space: '#1a0a05', obs: 'rock', oc: ['#8a3b1c', '#5c2410'], deco: 'dunes', effect: 'sand', desc: '沙尘暴：风向变化会让炮弹偏移。' },
  { name: '冰霜星', sub: '永冻冰原', enemy: '霜狼战车', ecol: '#2980b9', sphere: ['#e0f7ff', '#3a7bd5'], ground: ['#cfe8f5', '#e3f3fb', '#b5d6ea'], space: '#06121f', obs: 'ice', oc: ['#a8e0ff', '#5fa8d3'], deco: 'ice', effect: 'ice', desc: '冰面打滑：极难控制方向（越野履带 / 反重力引擎可抵消）。' },
  { name: '熔岩星', sub: '炼狱火山带', enemy: '炎魔重坦', ecol: '#ff5722', sphere: ['#ffb347', '#5a0d00'], ground: ['#2b1a17', '#3a221c', '#1e1210'], space: '#120404', obs: 'rock', oc: ['#4a3530', '#241814'], deco: 'lava', effect: 'lava', desc: '岩浆池：进入会持续受到灼烧伤害。' },
  { name: '毒雾星', sub: '瘴气沼泽', enemy: '瘴气幽灵', ecol: '#8e44ad', sphere: ['#b8f56b', '#3d1f5c'], ground: ['#3b4a2a', '#46583a', '#2f3b22'], space: '#0b0f06', obs: 'rock', oc: ['#5a6b45', '#34402a'], deco: 'toxic', effect: 'toxic', desc: '毒雾：视野受限，毒区会减速并持续伤害。' },
  { name: '水晶星', sub: '棱镜峡谷', enemy: '晶棱守卫', ecol: '#e84393', sphere: ['#f8b4ff', '#3b1f7a'], ground: ['#2a2346', '#342b58', '#211b38'], space: '#08051a', obs: 'crystal', oc: ['#d6a4ff', '#6c3fd1'], deco: 'crystal', effect: 'crystal', desc: '水晶反射：炮弹击中水晶与边界会反弹。' },
  { name: '黑洞边缘', sub: '事件视界', enemy: '奇点主宰', ecol: '#f1c40f', sphere: ['#ffd36b', '#000'], ground: ['#0e0f1a', '#15172a', '#0a0b14'], space: '#000', obs: 'tech', oc: ['#5b6275', '#2c303d'], deco: 'space', effect: 'hole', desc: '引力井：车辆与炮弹都会被中心奇点吸引。' },
];
const planetOf = L => PLANETS[(L - 1) % PLANETS.length];

// 武器参数
const WEAPONS = {
  std:     { look: 'std', dmg: 12, rate: 2.5, spd: 720, size: 5, color: '#ffe066' },
  twin:    { look: 'twin', dmg: 11, rate: 2.6, spd: 760, count: 2, parallel: true, size: 5, color: '#ffd24d' },
  mg:      { look: 'mg', dmg: 5, rate: 11, spd: 860, jitter: 0.07, size: 3.5, color: '#fff2a8', range: 380 },
  shot:    { look: 'shot', dmg: 8, rate: 1.4, spd: 700, count: 7, spread: 0.55, size: 4, life: 0.55, color: '#ffb35c', range: 230 },
  heavy:   { look: 'heavy', dmg: 44, rate: 0.9, spd: 620, size: 9, explode: 75, color: '#ff8a3d', recoil: 90 },
  missile: { look: 'missile', dmg: 22, rate: 1.6, spd: 480, count: 2, spread: 0.6, homing: 3.2, explode: 55, size: 6, life: 2.4, color: '#ff6b6b' },
  laser:   { look: 'laser', dmg: 16, rate: 5, spd: 1300, pierce: true, size: 4, color: '#ff4dff', beam: true },
  rail:    { look: 'rail', dmg: 85, rate: 0.7, spd: 2300, pierce: true, size: 5, color: '#6fe3ff', beam: true, range: 620, recoil: 70 },
  anti:    { look: 'anti', dmg: 60, rate: 1.1, spd: 560, explode: 140, homing: 1.2, size: 12, color: '#b76bff', life: 2.2 },
  nova:    { look: 'nova', dmg: 30, rate: 4, spd: 820, homing: 2.2, explode: 60, size: 7, color: '#fff06b', life: 2 },

let AC = null, master = null, noiseBuf = null;
const lastSfx = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.8, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}

  const now = performance.now(); if (now - (lastSfx[k] || 0) < 45) return; lastSfx[k] = now;

      st.x = t.clientX; st.y = t.clientY; st.dx = dx / R; st.dy = dy / R;

  const end = e => { for (const t of e.changedTouches) if (t.identifier === st.id) { st.active = false; st.id = null; st.dx = st.dy = 0; } };

function genArena(P) {
  const obstacles = [], hazards = [];
  const spawnP = { x: 220, y: H / 2 }, spawnE = { x: W - 220, y: H / 2 }, center = { x: W / 2, y: H / 2 };
  const free = (x, y, r, pad) => {
    if (Math.hypot(x - spawnP.x, y - spawnP.y) < r + 170 || Math.hypot(x - spawnE.x, y - spawnE.y) < r + 170) return false;
    if (P.effect === 'hole' && Math.hypot(x - center.x, y - center.y) < r + 260) return false;
    for (const o of obstacles) if (Math.hypot(x - o.x, y - o.y) < r + o.r + pad) return false;
    for (const h of hazards) if (Math.hypot(x - h.x, y - h.y) < r + h.r + pad) return false;
    return true;
  };
  if (P.effect === 'lava' || P.effect === 'toxic') {
    const n = P.effect === 'lava' ? 7 : 6;
    for (let i = 0, tries = 0; i < n && tries < 400; tries++) {
      const r = P.effect === 'lava' ? rand(55, 100) : rand(110, 165), x = rand(r + 40, W - r - 40), y = rand(r + 40, H - r - 40);
      if (free(x, y, r, 30)) { hazards.push({ x, y, r, type: P.effect, seed: Math.random() * 10 }); i++; }
    }
  }
  if (P.effect === 'hole') hazards.push({ x: center.x, y: center.y, r: 70, type: 'sing' });
  const n = P.effect === 'hole' ? 12 : 15;
  for (let i = 0, tries = 0; i < n && tries < 600; tries++) {
    const r = rand(28, 68), x = rand(r + 30, W - r - 30), y = rand(r + 30, H - r - 30);
    if (free(x, y, r, 70)) {
      const pts = []; const k = 9 + (Math.random() * 4 | 0);
      for (let j = 0; j < k; j++) pts.push(r * rand(0.88, 1.12));
      obstacles.push({ x, y, r, pts, rot: rand(0, 6.28) }); i++;
    }
  }
  return { obstacles, hazards, spawnP, spawnE };
}

function buildSkillBox() {

function tryDash(t) {
  if (!t || !t.dash || t.dashCd > 0 || !t.alive || !G || G.state !== 'fight') return;
  t.dashT = 0.22; t.dashCd = 2.5; sfx('skill');
  for (let i = 0; i < 14; i++) G.parts.push({ x: t.x, y: t.y, vx: rand(-80, 80), vy: rand(-80, 80), life: 0.5, max: 0.5, size: rand(4, 9), color: '#6fe3ff', type: 'glow' });
}

function useSkill(t) {
  if (!t || !t.skill || t.skillCd > 0 || !t.alive || !G || G.state !== 'fight') return;
  t.skillCd = t.skillMax; if (t.isPlayer) sfx('skill');
  const other = t === G.player ? G.enemy : G.player;
  switch (t.skill) {
    case 'repair': heal(t, t.maxHp * 0.25); break;
    case 'nanoheal': heal(t, t.maxHp * 0.4); t.hot = 4; break;
    case 'shield': t.shield = 3; break;
    case 'emp':
      G.rings.push({ x: t.x, y: t.y, r: 10, max: 450, life: 0.5, color: '#6fe3ff' });
      if (dist(t, other) < 450 + other.r) { other.stun = 2; text(other.x, other.y - 40, '瘫痪!', '#6fe3ff', 20); }
      break;
    case 'storm':
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2;
        G.bullets.push({ x: t.x + Math.cos(a) * 30, y: t.y + Math.sin(a) * 30, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, dmg: 15 * t.dmgMult, side: t.side, r: 5, life: 2.5, color: '#9af0ff', homing: 4.5, bounce: 0, trail: [] });
      }
      break;
  }
}
function heal(t, v) { v = Math.min(v, t.maxHp - t.hp); t.hp += v; if (v >= 1) text(t.x, t.y - 36, '+' + Math.round(v), '#3ddc84', 18); for (let i = 0; i < 16; i++) G.parts.push({ x: t.x + rand(-20, 20), y: t.y + rand(-20, 20), vx: 0, vy: rand(-60, -20), life: 0.8, max: 0.8, size: 4, color: '#3ddc84', type: 'glow' }); }
function text(x, y, s, color, size = 16) { G.texts.push({ x, y, s, color, size, t: 0 }); }

function fire(t) {
  const w = t.weapon; t.fireCd = 1 / (w.rate * t.fireMult);
  const n = w.count || 1, other = t === G.player ? G.enemy : G.player;
  for (let i = 0; i < n; i++) {
    let a = t.turret, ox = 0;
    if (n > 1) { if (w.parallel) ox = i ? 7 : -7; else a += (i / (n - 1) - 0.5) * w.spread; }
    a += (Math.random() - 0.5) * 2 * (w.jitter || 0);
    const c = Math.cos(t.turret), s = Math.sin(t.turret);
    const mx = t.x + c * 36 - s * ox, my = t.y + s * 36 + c * ox;
    G.bullets.push({ x: mx, y: my, vx: Math.cos(a) * w.spd, vy: Math.sin(a) * w.spd, dmg: w.dmg * t.dmgMult, side: t.side, r: w.size, life: w.life || 1.6,
      color: w.color, pierce: w.pierce, homing: w.homing, explode: w.explode, beam: w.beam, bounce: G.P.effect === 'crystal' ? 2 : 0, hitSet: null, trail: [], target: other });
    for (let k = 0; k < 5; k++) G.parts.push({ x: mx, y: my, vx: Math.cos(a) * rand(60, 220) + rand(-40, 40), vy: Math.sin(a) * rand(60, 220) + rand(-40, 40), life: 0.18, max: 0.18, size: rand(3, 6), color: w.color, type: 'glow' });
  }
  if (w.recoil) { t.vx -= Math.cos(t.turret) * w.recoil; t.vy -= Math.sin(t.turret) * w.recoil; }
  if (t.isPlayer) { sfx(w.beam ? 'laser' : (w.explode ? 'big' : 'shoot')); if (w.explode || w.recoil) G.shake = Math.max(G.shake, 5); }
  else sfx(w.beam ? 'laser' : 'eshoot');
}

function hurt(t, dmg, silent) {
  if (!t.alive) return;
  if (t.isPlayer && G.state !== 'fight') return;
  if (t.shield > 0) { if (!silent) { sfx('hit'); text(t.x, t.y - 40, '格挡', '#6fe3ff', 14); } return; }
  dmg *= 1 - t.red; t.hp -= dmg;
  if (!silent) { t.flash = 0.12; text(t.x + rand(-10, 10), t.y - 34, Math.round(dmg), t.isPlayer ? '#ff6b6b' : '#fff', 15 + Math.min(14, dmg / 5)); sfx('hit'); if (t.isPlayer) G.shake = Math.max(G.shake, 6); }
  if (t.hp <= 0) kill(t);
}

function kill(t) {
  t.hp = 0; t.alive = false; sfx('death'); G.shake = 22;
  for (let i = 0; i < 60; i++) { const a = rand(0, 7), s = rand(50, 420); G.parts.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 1.1), max: 1.1, size: rand(4, 12), color: ['#ffdd55', '#ff8a3d', '#ff4b2b', '#fff'][i % 4], type: 'glow' }); }
  for (let i = 0; i < 25; i++) G.parts.push({ x: t.x + rand(-20, 20), y: t.y + rand(-20, 20), vx: rand(-40, 40), vy: rand(-60, 10), life: rand(1, 2), max: 2, size: rand(14, 30), color: '#333', type: 'smoke' });
  G.rings.push({ x: t.x, y: t.y, r: 10, max: 160, life: 0.5, color: '#ffcc66' });
  if (t === G.enemy && G.state === 'fight') { G.state = 'loot'; G.endT = 0; spawnLoot(t.x, t.y); }
  else if (t === G.player && G.state === 'fight') { G.state = 'dead'; G.endT = 0; }
}

function spawnLoot(x, y) {
  const L = G.L, first = L > S.cleared;
  let gold = Math.round((100 + L * 60) * rand(0.9, 1.2)), dia = 2 * L + (Math.random() * 3 | 0);
  if (first) { gold = Math.round(gold * 1.5); dia += 5 + 2 * L; }
  G.reward = { gold, dia, first };
  const burst = (total, maxN, type) => {
    const n = Math.max(1, Math.min(maxN, total)); const base = Math.floor(total / n); let rem = total - base * n;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(160, 520);
      G.loot.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, type, val: base + (rem-- > 0 ? 1 : 0), t: rand(-0.1, 0.1), spin: rand(0, 6) });
    }
  };
  burst(gold, 36, 'gold'); burst(dia, 18, 'dia');
  sfx('boom');
}

function lineBlocked(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  for (const o of G.obstacles) {
    const t = clamp(((o.x - ax) * dx + (o.y - ay) * dy) / L2, 0, 1);
    if (Math.hypot(ax + dx * t - o.x, ay + dy * t - o.y) < o.r + 4) return true;
  }
  return false;
}

function moveTank(t, ix, iy, dt) {
  const P = G.P; let l = Math.hypot(ix, iy); if (l > 1) { ix /= l; iy /= l; l = 1; }
  if (t.stun > 0) { ix = iy = 0; }
  let spd = t.spd * (t.dashT > 0 ? 3.2 : 1);
  let acc = 10;
  if (P.effect === 'ice') acc = t.grip ? 6 : 1.3;
  if (P.effect === 'moon') acc = t.grip ? 7 : 3;
  if (t.dashT > 0) acc = 25;
  for (const h of G.hazards) {
    if (Math.hypot(t.x - h.x, t.y - h.y) < h.r + t.r * 0.5) {
      if (h.type === 'sing') hurt(t, 45 * G.dt, true);
      else if (!t.hover) {
        if (h.type === 'lava') { hurt(t, 20 * G.dt, true); if (Math.random() < 0.3) G.parts.push({ x: t.x + rand(-20, 20), y: t.y + rand(-20, 20), vx: rand(-20, 20), vy: rand(-80, -30), life: 0.5, max: 0.5, size: rand(3, 7), color: '#ff7a1a', type: 'glow' }); }
        if (h.type === 'toxic') { spd *= 0.55; hurt(t, 6 * G.dt, true); }
      }
    }
  }
  t.vx += (ix * spd - t.vx) * Math.min(1, acc * dt);
  t.vy += (iy * spd - t.vy) * Math.min(1, acc * dt);
  let gx = 0, gy = 0;
  if (P.effect === 'hole') {
    const dx = W / 2 - t.x, dy = H / 2 - t.y, d = Math.hypot(dx, dy) || 1, g = 70 * (300 / (d + 150)) * (t.hover ? 0.5 : 1);
    gx = dx / d * g; gy = dy / d * g;
  }
  t.x += (t.vx + gx) * dt; t.y += (t.vy + gy) * dt;
  const sp = Math.hypot(t.vx, t.vy); t.trackPhase += sp * dt * 0.5;
  if (l > 0.15) t.hull += angDiff(t.hull, Math.atan2(iy, ix)) * Math.min(1, 8 * dt);
  else if (sp > 40) t.hull += angDiff(t.hull, Math.atan2(t.vy, t.vx)) * Math.min(1, 3 * dt);
  // 碰撞
  for (const o of G.obstacles) {
    const dx = t.x - o.x, dy = t.y - o.y, d = Math.hypot(dx, dy), m = o.r + t.r;
    if (d < m && d > 0) { const nx = dx / d, ny = dy / d; t.x = o.x + nx * m; t.y = o.y + ny * m; const vn = t.vx * nx + t.vy * ny; if (vn < 0) { t.vx -= vn * nx * 1.2; t.vy -= vn * ny * 1.2; } }
  }
  if (t.x < t.r + 12) { t.x = t.r + 12; t.vx = Math.abs(t.vx) * 0.3; }
  if (t.x > W - t.r - 12) { t.x = W - t.r - 12; t.vx = -Math.abs(t.vx) * 0.3; }
  if (t.y < t.r + 12) { t.y = t.r + 12; t.vy = Math.abs(t.vy) * 0.3; }
  if (t.y > H - t.r - 12) { t.y = H - t.r - 12; t.vy = -Math.abs(t.vy) * 0.3; }
}

function tickTank(t, dt) {
  t.fireCd -= dt; t.skillCd = Math.max(0, t.skillCd - dt); t.shield = Math.max(0, t.shield - dt); t.stun = Math.max(0, t.stun - dt);
  t.dashCd = Math.max(0, t.dashCd - dt); t.dashT = Math.max(0, t.dashT - dt); t.flash = Math.max(0, t.flash - dt);
  if (t.alive && t.regen && t.hp < t.maxHp) t.hp = Math.min(t.maxHp, t.hp + t.regen * dt);
  if (t.alive && t.hot > 0) { t.hot -= dt; t.hp = Math.min(t.maxHp, t.hp + t.maxHp * 0.03 * dt); }
  if (t.dashT > 0) G.parts.push({ x: t.x, y: t.y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 20, color: 'rgba(111,227,255,.5)', type: 'glow' });
}

function updatePlayer(p, dt) {
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1; if (keys.KeyS || keys.ArrowDown) iy += 1;
  if (stickL.active) { ix = stickL.dx; iy = stickL.dy; }
  let firing = false, aim = p.turret;
  if (stickR.active) {
    if (Math.hypot(stickR.dx, stickR.dy) > 0.2) { aim = Math.atan2(stickR.dy, stickR.dx); firing = true; }
  } else if (isTouch) {
    // 未操作右摇杆时自动朝向敌人
    if (G.enemy.alive) aim = Math.atan2(G.enemy.y - p.y, G.enemy.x - p.x);
  } else {
    const wx = mouse.x / SC + G.cam.x, wy = mouse.y / SC + G.cam.y;
    aim = Math.atan2(wy - p.y, wx - p.x); firing = mouse.down;
  }
  if (!p.alive) return;
  moveTank(p, ix, iy, dt);
  if (p.stun <= 0) p.turret += angDiff(p.turret, aim) * Math.min(1, 18 * dt);
  if (firing && p.fireCd <= 0 && p.stun <= 0 && G.state === 'fight') fire(p);
}

function updateEnemy(e, p, dt) {
  if (!e.alive) return;
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const w = e.weapon, pref = w.range || 420;
  let ix = 0, iy = 0;
  if (p.alive) {
    const radial = clamp((d - pref) / 150, -1, 1); ix += ux * radial; iy += uy * radial;
    e.strafeT -= dt; if (e.strafeT <= 0) { e.strafeDir = Math.random() < 0.6 ? -e.strafeDir : e.strafeDir; e.strafeT = rand(1, 2.8); }
    ix += -uy * e.strafeDir * 0.85; iy += ux * e.strafeDir * 0.85;
  }
  for (const o of G.obstacles) {
    const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), gap = od - o.r - e.r;
    if (gap < 70) { const k = (70 - gap) / 70 * 1.6; ix += ox / od * k; iy += oy / od * k; }
  }
  for (const h of G.hazards) {
    if (e.hover && h.type !== 'sing') continue;
    const ox = e.x - h.x, oy = e.y - h.y, od = Math.hypot(ox, oy) || 1, gap = od - h.r;
    const R = h.type === 'sing' ? 330 : 70;
    if (gap < R) { const k = (R - gap) / R * 2.2; ix += ox / od * k; iy += oy / od * k; }
  }
  const m = 110;
  if (e.x < m) ix += (m - e.x) / m * 2; if (e.x > W - m) ix -= (e.x - W + m) / m * 2;
  if (e.y < m) iy += (m - e.y) / m * 2; if (e.y > H - m) iy -= (e.y - H + m) / m * 2;
  // 卡住检测
  if (Math.hypot(e.vx, e.vy) < 25) { e.stuckT += dt; if (e.stuckT > 0.8) { e.strafeDir *= -1; e.stuckT = 0; } } else e.stuckT = 0;
  moveTank(e, ix, iy, dt);
  if (!p.alive || e.stun > 0 || G.state !== 'fight') return;
  // 瞄准（带提前量）
  const tt = d / w.spd * 0.85;
  e.aimNoise += rand(-1, 1) * dt * 1.5; e.aimNoise = clamp(e.aimNoise, -e.aimErr, e.aimErr);
  const aim = Math.atan2(p.y + p.vy * tt - e.y, p.x + p.vx * tt - e.x) + e.aimNoise;
  e.turret += angDiff(e.turret, aim) * Math.min(1, 6 * dt);
  const los = w.pierce || w.homing || !lineBlocked(e.x, e.y, p.x, p.y);
  if (e.fireCd <= 0 && los && Math.abs(angDiff(e.turret, aim)) < 0.25 && d < 1100) fire(e);
  if (e.skill && e.skillCd <= 0 && e.hp < e.maxHp * 0.5) useSkill(e);
}

function explode(b) {
  const R = b.explode, t = b.side === 'p' ? G.enemy : G.player;
  const d = dist(b, t);
  if (d < R + t.r) hurt(t, b.dmg * (1 - 0.5 * clamp(d / (R + t.r), 0, 1)));
  G.rings.push({ x: b.x, y: b.y, r: 5, max: R, life: 0.35, color: b.color });
  for (let i = 0; i < 18; i++) { const a = rand(0, 7), s = rand(40, R * 3); G.parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.5), max: 0.5, size: rand(3, 8), color: i % 2 ? b.color : '#ffdd88', type: 'glow' }); }
  G.shake = Math.max(G.shake, R / 12); sfx('boom');
}
function spark(x, y, color, n = 6) { for (let i = 0; i < n; i++) { const a = rand(0, 7), s = rand(40, 200); G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25, max: 0.25, size: rand(2, 4), color, type: 'glow' }); } }

function updateBullets(dt) {
  const P = G.P, arr = G.bullets;
  for (let i = arr.length - 1; i >= 0; i--) {
    const b = arr[i], tgt = b.side === 'p' ? G.enemy : G.player;
    let dead = false;
    if (b.homing && tgt.alive) {
      const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(b.vy, b.vx), want = Math.atan2(tgt.y - b.y, tgt.x - b.x);
      const na = a + clamp(angDiff(a, want), -b.homing * dt, b.homing * dt); b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    if (P.effect === 'sand' && !b.beam) { b.vx += G.wind.x * dt; b.vy += G.wind.y * dt; }
    if (P.effect === 'hole') { const dx = W / 2 - b.x, dy = H / 2 - b.y, d = Math.hypot(dx, dy) || 1, g = 380 * (300 / (d + 100)) * (b.beam ? 0.4 : 1); b.vx += dx / d * g * dt; b.vy += dy / d * g * dt; if (d < 40) dead = true; }
    b.trail.push(b.x, b.y); if (b.trail.length > (b.beam ? 12 : 8)) b.trail.splice(0, 2);
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    // 障碍物
    if (!b.pierce) for (const o of G.obstacles) {
      const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
      if (d < o.r + b.r * 0.5) {
        if (b.bounce > 0) {
          const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
          b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; b.x = o.x + nx * (o.r + b.r); b.y = o.y + ny * (o.r + b.r); b.bounce--; spark(b.x, b.y, '#e6c8ff', 5);
        } else { dead = true; if (b.explode) explode(b); else spark(b.x, b.y, b.color); }
        break;
      }
    }
    // 边界
    if (!dead && (b.x < 10 || b.x > W - 10 || b.y < 10 || b.y > H - 10)) {
      if (b.bounce > 0) { if (b.x < 10 || b.x > W - 10) b.vx *= -1; else b.vy *= -1; b.x = clamp(b.x, 11, W - 11); b.y = clamp(b.y, 11, H - 11); b.bounce--; }
      else { dead = true; if (b.explode) explode(b); }
    }
    // 命中
    if (!dead && tgt.alive && Math.hypot(b.x - tgt.x, b.y - tgt.y) < tgt.r + b.r) {
      if (b.explode) { explode(b); dead = true; }
      else if (b.pierce) { if (!b.hitSet) { b.hitSet = 1; hurt(tgt, b.dmg); spark(b.x, b.y, b.color, 10); } }
      else { hurt(tgt, b.dmg); spark(b.x, b.y, b.color, 8); dead = true; }
    }
    if (!dead && b.life <= 0) { dead = true; if (b.explode) explode(b); }
    if (dead) arr.splice(i, 1);
  }
}

function updateDrone(dt) {
  const d = G.drone, p = G.player; if (!d || !p.alive) return;
  d.a += dt * 2.2; d.x = p.x + Math.cos(d.a) * 55; d.y = p.y + Math.sin(d.a) * 55;
  d.cd -= dt;
  const e = G.enemy;
  if (d.cd <= 0 && e.alive && G.state === 'fight' && dist(d, e) < 700) {
    d.cd = 0.45; const a = Math.atan2(e.y - d.y, e.x - d.x);
    G.bullets.push({ x: d.x, y: d.y, vx: Math.cos(a) * 850, vy: Math.sin(a) * 850, dmg: 7, side: 'p', r: 3.5, life: 1.2, color: '#9af0ff', homing: 1.5, bounce: 0, trail: [] });
  }
}

function updateLoot(dt) {
  const p = G.player;
  for (let i = G.loot.length - 1; i >= 0; i--) {
    const c = G.loot[i]; c.t += dt; c.spin += dt * 5;
    if (c.t < 0.7) { c.vx *= 1 - 3 * dt; c.vy *= 1 - 3 * dt; }
    else { const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1, s = 250 + (c.t - 0.7) * 900; c.vx += (dx / d * s - c.vx) * Math.min(1, 6 * dt); c.vy += (dy / d * s - c.vy) * Math.min(1, 6 * dt); }
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.x = clamp(c.x, 15, W - 15); c.y = clamp(c.y, 15, H - 15);
    if (Math.hypot(p.x - c.x, p.y - c.y) < p.r + 10) {
      G.earned[c.type] += c.val; sfx(c.type === 'gold' ? 'coin' : 'dia');
      text(c.x, c.y - 10, '+' + c.val, c.type === 'gold' ? '#ffc83d' : '#6fe3ff', c.type === 'gold' ? 13 : 16);
      G.loot.splice(i, 1);
    }
  }
}

function update(dt) {
  G.t += dt; G.dt = dt;
  const P = G.P, p = G.player, e = G.enemy;
  if (P.effect === 'sand') {
    G.wind.t -= dt; if (G.wind.t <= 0) { const a = rand(0, 7), s = rand(120, 320); G.wind.tx = Math.cos(a) * s; G.wind.ty = Math.sin(a) * s; G.wind.t = rand(4, 7); }
    G.wind.x += (G.wind.tx - G.wind.x) * dt * 0.8; G.wind.y += (G.wind.ty - G.wind.y) * dt * 0.8;
  }
  tickTank(p, dt); tickTank(e, dt);
  updatePlayer(p, dt);
  updateEnemy(e, p, dt);
  // 车辆互撞
  if (p.alive && e.alive) {
    const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy), m = p.r + e.r;
    if (d < m && d > 0) { const nx = dx / d, ny = dy / d, o = (m - d) / 2; p.x -= nx * o; p.y -= ny * o; e.x += nx * o; e.y += ny * o; }
  }
  updateDrone(dt);
  updateBullets(dt);
  updateLoot(dt);
  for (let i = G.parts.length - 1; i >= 0; i--) { const q = G.parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - 2 * dt; q.vy *= 1 - 2 * dt; if (q.life <= 0) G.parts.splice(i, 1); }
  for (let i = G.rings.length - 1; i >= 0; i--) { const r = G.rings[i]; r.life -= dt; r.r += (r.max - r.r) * Math.min(1, 12 * dt); if (r.life <= 0) G.rings.splice(i, 1); }
  for (let i = G.texts.length - 1; i >= 0; i--) { const t = G.texts[i]; t.t += dt; t.y -= 40 * dt; if (t.t > 0.9) G.texts.splice(i, 1); }
  G.shake = Math.max(0, G.shake - dt * 30);
  // 结束判定
  if (G.state === 'loot') {
    G.endT += dt;
    if (G.endT > 6) { for (const c of G.loot) G.earned[c.type] += c.val; G.loot.length = 0; }
    if (G.loot.length === 0) { G.state = 'ending'; G.endT = 0; }
  } else if (G.state === 'ending') { G.endT += dt; if (G.endT > 0.9) finishBattle(true); }
  else if (G.state === 'dead') { G.endT += dt; if (G.endT > 1.8) finishBattle(false); }
  // 镜头
  const vw = VW / SC, vh = VH / SC;
  const tx = vw >= W ? (W - vw) / 2 : clamp(p.x - vw / 2, -40, W - vw + 40);
  const ty = vh >= H ? (H - vh) / 2 : clamp(p.y - vh / 2, -40, H - vh + 40);
  G.cam.x += (tx - G.cam.x) * Math.min(1, 6 * dt); G.cam.y += (ty - G.cam.y) * Math.min(1, 6 * dt);
}

/* ================= 渲染 ================= */
function drawBarrel(c, look, t) {
  const dark = '#23272f', mid = '#3a404c';
  c.fillStyle = dark; c.strokeStyle = '#11141a'; c.lineWidth = 1.5;
  const bar = (x, y, w, h) => { c.fillStyle = mid; c.fillRect(x, y, w, h); c.strokeRect(x, y, w, h); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(x, y, w, h / 3); };
  switch (look) {
    case 'twin': bar(0, -10, 32, 6); bar(0, 4, 32, 6); break;
    case 'mg': bar(0, -3, 42, 6); bar(32, -5, 8, 10); break;
    case 'shot': bar(0, -8, 30, 16); c.fillStyle = '#000'; for (const y of [-4, 0, 4]) c.fillRect(28, y - 1.5, 3, 3); break;
    case 'heavy': bar(0, -7, 42, 14); bar(38, -10, 9, 20); break;
    case 'missile': bar(-6, -15, 28, 30); c.fillStyle = '#ff6b6b'; for (const [x, y] of [[18, -8], [18, 8], [10, -8], [10, 8]]) { circle(c, x, y, 3.5); c.fill(); } break;
    case 'laser': bar(0, -5, 38, 10); c.fillStyle = '#ff4dff'; c.shadowColor = '#ff4dff'; c.shadowBlur = 10; c.fillRect(4, -1.5, 36, 3); c.shadowBlur = 0; break;
    case 'rail': bar(0, -9, 48, 5); bar(0, 4, 48, 5); c.fillStyle = 'rgba(111,227,255,.8)'; c.shadowColor = '#6fe3ff'; c.shadowBlur = 12; c.fillRect(6, -2, 40, 4); c.shadowBlur = 0; break;
    case 'anti': bar(0, -6, 30, 12); c.fillStyle = '#b76bff'; c.shadowColor = '#b76bff'; c.shadowBlur = 16; circle(c, 36, 0, 8); c.fill(); c.shadowBlur = 0; break;
    case 'nova': bar(0, -7, 36, 14); c.strokeStyle = '#fff06b'; c.lineWidth = 3; c.shadowColor = '#fff06b'; c.shadowBlur = 14; circle(c, 38, 0, 8); c.stroke(); c.shadowBlur = 0; break;
    default: bar(0, -4, 36, 8);
  }
}
function drawTank(c, t, time) {
  c.save(); c.translate(t.x, t.y);
  c.save(); c.rotate(t.hull);
  c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -26, -21, 58, 50, 9); c.fill();
  c.fillStyle = '#1b1d22'; rr(c, -29, -26, 58, 14, 4); c.fill(); rr(c, -29, 12, 58, 14, 4); c.fill();
  c.strokeStyle = '#484d58'; c.lineWidth = 2; const ph = (t.trackPhase || 0) % 8;
  c.beginPath(); for (let x = -27 + (8 - ph); x < 28; x += 8) { c.moveTo(x, -25); c.lineTo(x, -13); c.moveTo(x, 13); c.lineTo(x, 25); } c.stroke();
  const g = c.createLinearGradient(0, -16, 0, 16); g.addColorStop(0, shade(t.color, 0.3)); g.addColorStop(1, t.dark);
  c.fillStyle = g; rr(c, -24, -16, 48, 32, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = t.accent; c.fillRect(15, -11, 5, 22);
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(-20, -12, 30, 5);
  c.restore();
  c.save(); c.rotate(t.turret);
  drawBarrel(c, t.weapon.look, t);
  c.fillStyle = t.dark; circle(c, 0, 0, 14); c.fill();
  const tg = c.createRadialGradient(-4, -4, 1, 0, 0, 12); tg.addColorStop(0, shade(t.color, 0.45)); tg.addColorStop(1, t.color);
  c.fillStyle = tg; circle(c, 0, 0, 11); c.fill();
  c.fillStyle = t.accent; circle(c, 0, 0, 3.5); c.fill();
  c.restore();
  if (t.flash > 0) { c.fillStyle = `rgba(255,255,255,${t.flash * 5})`; circle(c, 0, 0, 27); c.fill(); }
  if (t.shield > 0) {
    const a = 0.35 + Math.sin(time * 20) * 0.1;
    c.strokeStyle = `rgba(111,227,255,${a + 0.3})`; c.lineWidth = 3; c.fillStyle = `rgba(111,227,255,${a * 0.4})`;
    circle(c, 0, 0, 40); c.fill(); c.stroke();
  }
  if (t.stun > 0) {
    c.strokeStyle = '#9af0ff'; c.lineWidth = 2; c.beginPath();
    for (let k = 0; k < 3; k++) { let a = rand(0, 7), x = Math.cos(a) * 30, y = Math.sin(a) * 30; c.moveTo(x, y); for (let j = 0; j < 3; j++) { x += rand(-12, 12); y += rand(-12, 12); c.lineTo(x, y); } }
    c.stroke();
  }
  c.restore();
}

function drawHazards(time) {
  for (const h of G.hazards) {
    if (h.type === 'lava') {
      const pulse = Math.sin(time * 2 + h.seed) * 0.08;
      const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r * 1.25);
      g.addColorStop(0, '#fff17a'); g.addColorStop(0.35, '#ff9a1a'); g.addColorStop(0.75, '#e2380b'); g.addColorStop(0.8 + pulse, 'rgba(120,20,0,.7)'); g.addColorStop(1, 'rgba(60,10,0,0)');
      ctx.fillStyle = g; circle(ctx, h.x, h.y, h.r * 1.25); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,200,.5)';
      for (let k = 0; k < 3; k++) { const a = time * 0.6 + k * 2.1 + h.seed; circle(ctx, h.x + Math.cos(a) * h.r * 0.5, h.y + Math.sin(a * 1.3) * h.r * 0.4, 4 + Math.sin(time * 4 + k) * 2); ctx.fill(); }
    } else if (h.type === 'toxic') {
      const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
      g.addColorStop(0, 'rgba(160,255,90,.45)'); g.addColorStop(0.7, 'rgba(120,60,180,.3)'); g.addColorStop(1, 'rgba(120,60,180,0)');
      ctx.fillStyle = g; circle(ctx, h.x, h.y, h.r); ctx.fill();
      for (let k = 0; k < 5; k++) { const a = time * 0.4 + k * 1.3 + h.seed; ctx.fillStyle = 'rgba(190,255,120,.12)'; circle(ctx, h.x + Math.cos(a) * h.r * 0.45, h.y + Math.sin(a) * h.r * 0.45, h.r * 0.4); ctx.fill(); }
    } else if (h.type === 'sing') {
      for (let k = 6; k >= 1; k--) {
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(time * (0.3 + k * 0.15));
        ctx.strokeStyle = `hsla(${35 + k * 6},100%,${50 + k * 5}%,${0.12 + k * 0.04})`; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.ellipse(0, 0, 90 + k * 38, 40 + k * 16, 0, 0, Math.PI * 1.4); ctx.stroke(); ctx.restore();
      }
      const g = ctx.createRadialGradient(h.x, h.y, 10, h.x, h.y, 110); g.addColorStop(0, '#000'); g.addColorStop(0.6, '#000'); g.addColorStop(0.75, 'rgba(255,190,80,.8)'); g.addColorStop(1, 'rgba(255,120,0,0)');
      ctx.fillStyle = g; circle(ctx, h.x, h.y, 110); ctx.fill();
    }

}

function drawBullet(b) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  if (b.trail.length >= 4) {
    ctx.strokeStyle = b.color; ctx.lineCap = 'round';
    ctx.lineWidth = b.beam ? b.r * 1.6 : b.r;
    ctx.globalAlpha = b.beam ? 0.7 : 0.35;
    ctx.beginPath(); ctx.moveTo(b.trail[0], b.trail[1]); for (let i = 2; i < b.trail.length; i += 2) ctx.lineTo(b.trail[i], b.trail[i + 1]); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowColor = b.color; ctx.shadowBlur = 12;
  ctx.fillStyle = b.color; circle(ctx, b.x, b.y, b.r); ctx.fill();
  ctx.fillStyle = '#fff'; circle(ctx, b.x, b.y, b.r * 0.45); ctx.fill();
  ctx.restore();
}

function drawLoot(c, time) {
  ctx.save(); ctx.translate(c.x, c.y);
  const bob = Math.sin(time * 6 + c.spin) * 2;
  if (c.type === 'gold') {
    const sx = Math.abs(Math.cos(c.spin));
    ctx.scale(Math.max(0.2, sx), 1);
    ctx.shadowColor = '#ffc83d'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#e09a12'; circle(ctx, 0, bob, 9); ctx.fill();
    ctx.fillStyle = '#ffd95a'; circle(ctx, 0, bob, 6.5); ctx.fill();
    ctx.fillStyle = '#b87400'; ctx.fillRect(-1.5, bob - 4, 3, 8);
  } else {
    ctx.rotate(Math.sin(c.spin) * 0.3);
    ctx.shadowColor = '#6fe3ff'; ctx.shadowBlur = 16;
    const g = ctx.createLinearGradient(-10, -12, 10, 12); g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#6fe3ff'); g.addColorStop(1, '#7b3fe4');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, bob - 13); ctx.lineTo(10, bob - 3); ctx.lineTo(0, bob + 12); ctx.lineTo(-10, bob - 3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
}

function drawMinimap() {
  const mw = isTouch ? 130 : 170, mh = mw * H / W, x = VW - mw - 12, y = 64;
  ctx.fillStyle = 'rgba(5,8,18,.7)'; ctx.fillRect(x, y, mw, mh);
  ctx.strokeStyle = 'rgba(160,190,255,.4)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, mw, mh);
  const k = mw / W;
  ctx.fillStyle = 'rgba(200,200,220,.35)';
  for (const o of G.obstacles) { circle(ctx, x + o.x * k, y + o.y * k, Math.max(1.5, o.r * k)); ctx.fill(); }
  for (const h of G.hazards) { ctx.fillStyle = h.type === 'lava' ? 'rgba(255,110,20,.6)' : h.type === 'toxic' ? 'rgba(150,230,80,.35)' : '#ffb347'; circle(ctx, x + h.x * k, y + h.y * k, Math.max(2, h.r * k)); ctx.fill(); }
  const vis = G.P.effect !== 'toxic' || dist(G.player, G.enemy) < 420;
  if (G.enemy.alive && vis) { ctx.fillStyle = '#ff5a5a'; circle(ctx, x + G.enemy.x * k, y + G.enemy.y * k, 3.5); ctx.fill(); }
  ctx.fillStyle = '#6fe3ff'; circle(ctx, x + G.player.x * k, y + G.player.y * k, 3.5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.strokeRect(x + G.cam.x * k, y + G.cam.y * k, VW / SC * k, VH / SC * k);
}

function drawStick(st) {
  if (!st.active) return;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; circle(ctx, st.ox, st.oy, 60); ctx.stroke();
  ctx.fillStyle = 'rgba(160,200,255,.45)'; circle(ctx, st.ox + st.dx * 60, st.oy + st.dy * 60, 26); ctx.fill();
}

    ctx.fillStyle = '#1d4596'; circle(ctx, 0, 0, 4); ctx.fill(); ctx.restore();

  // 屏幕空间效果

  if (P.effect === 'toxic' && Pl.alive) {
    const px = (Pl.x - G.cam.x) * SC, py = (Pl.y - G.cam.y) * SC;
    const g = ctx.createRadialGradient(px, py, 260 * SC, px, py, 460 * SC);
    g.addColorStop(0, 'rgba(12,22,6,0)'); g.addColorStop(1, 'rgba(12,22,6,.94)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${0.25 + Math.sin(time * 6) * 0.1})`); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  if (!isTouch && screen === 'battle') {
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; circle(ctx, mouse.x, mouse.y, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x - 16, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y); ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 16, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 16); ctx.lineTo(mouse.x, mouse.y - 6); ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 16); ctx.stroke();
  }
}

const STARS = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1), h: rand(0, 360) }));
function drawStars(time) {
  const g = ctx.createLinearGradient(0, 0, VW, VH); g.addColorStop(0, '#070a1c'); g.addColorStop(1, '#10051c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  for (const s of STARS) {
    const x = ((s.x + time * 0.004 * s.z) % 1) * VW, y = s.y * VH;
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(time * s.z + s.h)); ctx.fillStyle = `hsl(${s.h},60%,85%)`;
    ctx.fillRect(x, y, s.z * 2.2, s.z * 2.2);
  }
  ctx.globalAlpha = 1;
  // 背景大星球
  const R = Math.min(VW, VH) * 0.5, cx = VW * 0.92, cy = VH * 1.02;
  const pg = ctx.createRadialGradient(cx - R * 0.4, cy - R * 0.4, R * 0.1, cx, cy, R);
  pg.addColorStop(0, '#6b4bd6'); pg.addColorStop(0.6, '#241456'); pg.addColorStop(1, '#0a0620');
  ctx.fillStyle = pg; circle(ctx, cx, cy, R); ctx.fill();
  ctx.strokeStyle = 'rgba(183,107,255,.35)'; ctx.lineWidth = 3; circle(ctx, cx, cy, R + 4); ctx.stroke();
}

/* ================= HUD ================= */
function updateHud() {
  const p = G.player, e = G.enemy;
  $('#phpbar').style.transform = `scaleX(${p.hp / p.maxHp})`; $('#phplag').style.transform = `scaleX(${p.hp / p.maxHp})`;
  $('#ehpbar').style.transform = `scaleX(${e.hp / e.maxHp})`; $('#ehplag').style.transform = `scaleX(${e.hp / e.maxHp})`;
  $('#phpt').textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
  $('#ehpt').textContent = `${Math.ceil(e.hp)} / ${e.maxHp}`;
  const sk = $('#skS .cd'); if (sk) sk.style.transform = `scaleY(${p.skillMax ? p.skillCd / p.skillMax : 0})`;
  const dk = $('#skD .cd'); if (dk) dk.style.transform = `scaleY(${p.dashCd / 2.5})`;
  if (isTouch) { $('#tskill').style.opacity = p.skillCd > 0 ? 0.4 : 1; $('#tdash').style.opacity = p.dashCd > 0 ? 0.4 : 1; }
  if (G.state !== 'fight' && G.state !== 'dead') $('#lootc').innerHTML = `<span style="color:var(--gold)">🪙 ${G.earned.gold}</span> &nbsp; <span style="color:var(--dia)">💎 ${G.earned.dia}</span>`;
}

/* ================= 流程 / 界面 ================= */
function show(name) {
  screen = name;
  for (const id of ['map', 'garage', 'result', 'pause']) $('#' + id).classList.toggle('show', id === name);
  const inBattle = name === 'battle' || name === 'pause';
  $('#hud').classList.toggle('show', inBattle);
  $('#touch').classList.toggle('show', name === 'battle' && isTouch);
  cvs.style.cursor = name === 'battle' && !isTouch ? 'none' : 'default';
  if (name === 'map') renderMap();
  if (name === 'garage') renderGarage();
  refreshMoney();
}
function refreshMoney() { document.querySelectorAll('.vg').forEach(e => e.textContent = S.gold); document.querySelectorAll('.vd').forEach(e => e.textContent = S.dia); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600); }

function togglePause() {
  if (screen === 'battle' && G && G.state === 'fight') { paused = true; show('pause'); }
  else if (screen === 'pause') { paused = false; show('battle'); }
}
$('#pausebtn').onclick = togglePause;
$('#resume').onclick = () => { paused = false; show('battle'); };
$('#quit').onclick = () => { paused = false; G = null; show('map'); };

function weaponLabel(k) { const it = ITEMS.find(i => i.w === k); return it ? it.name : k; }

function renderMap() {
  const box = $('#planets'); box.innerHTML = '';
  const levels = PLANETS.map((_, i) => i + 1);
  if (S.cleared >= PLANETS.length) levels.push(S.cleared + 1);
  for (const L of levels) {
    const P = planetOf(L), es = enemySpec(L), endless = L > PLANETS.length;
    const locked = L > S.cleared + 1, done = L <= S.cleared;
    const d = document.createElement('div');
    d.className = 'pcard' + (locked ? ' locked' : '');
    d.innerHTML = `<div class="sphere" style="background:radial-gradient(circle at 32% 30%, ${P.sphere[0]}, ${P.sphere[1]} 75%)"></div>
      <div class="lv">${endless ? '无尽深空' : '星球'} · LV.${L}</div><div class="nm">${endless ? '深空·' + P.name : P.name}</div><div class="sub">${P.sub}</div>
      <div class="desc">${P.desc}</div>
      <div class="foe"><span>守卫：${locked ? '???' : es.name}</span><span>${locked ? '' : '❤ ' + es.hp + ' · ' + weaponLabel(es.weaponKey)}</span></div>
      <span class="tag ${done ? 'done' : locked ? 'lock' : 'next'}">${done ? '✓ 已征服 · 可刷资源' : locked ? '🔒 击败上一星球解锁' : '⚔ 可挑战 · 首通奖励加成'}</span>`;
    if (!locked) d.onclick = () => { sfx('click'); startBattle(L); };
    box.appendChild(d);
  }
}

let garageTab = 'weapon';
function itemStats(it) {
  if (it.slot === 'weapon') {
    const w = WEAPONS[it.w], tags = [];
    if (w.count > 1) tags.push(w.parallel ? '双管' : `${w.count}发散射`);
    if (w.homing) tags.push('追踪'); if (w.pierce) tags.push('穿透'); if (w.explode) tags.push('爆炸');
    return `伤害 ${w.dmg}${w.count > 1 ? '×' + w.count : ''} · 射速 ${w.rate}/秒<br>秒伤约 ${Math.round(w.dmg * (w.count || 1) * w.rate)}${tags.length ? ' · ' + tags.join(' / ') : ''}`;
  }
  if (it.slot === 'armor') return `生命 ${it.hp}${it.red ? ' · 减伤 ' + Math.round(it.red * 100) + '%' : ''}${it.regen ? ' · 回血 ' + it.regen + '/秒' : ''}`;
  if (it.slot === 'engine') return `速度 ${it.spd}${it.grip ? ' · 抓地' : ''}${it.hover ? ' · 悬浮' : ''}${it.dash ? ' · 冲刺' : ''}`;
  return '';
}
function renderGarage() {
  $('#tabs').innerHTML = SLOTS.map(s => `<button class="tab ${s.k === garageTab ? 'on' : ''}" data-k="${s.k}">${s.i} ${s.n}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { garageTab = b.dataset.k; sfx('click'); renderGarage(); });
  const list = ITEMS.filter(i => i.slot === garageTab);
  $('#items').innerHTML = list.map(it => {
    const owned = S.owned.includes(it.id), eq = S.equip[it.slot] === it.id, locked = !owned && it.unlock > S.cleared, hi = it.cur === 'dia';
    const afford = it.cur === 'gold' ? S.gold >= it.price : S.dia >= it.price;
    let btn;
    if (eq) btn = `<button class="btn alt" disabled>✓ 已装备</button>`;
    else if (owned) btn = `<button class="btn" data-a="eq" data-id="${it.id}">装备</button>`;
    else if (locked) btn = `<button class="btn alt" disabled>🔒 通关 ${planetOf(it.unlock).name} 解锁</button>`;
    else btn = `<button class="btn ${hi ? 'dia' : 'gold'}" data-a="buy" data-id="${it.id}" ${afford ? '' : 'disabled'}>${hi ? '💎' : '🪙'} ${it.price} 购买</button>`;
    return `<div class="item ${hi ? 'hi' : ''} ${eq ? 'eq' : ''} ${locked ? 'lk' : ''}">
      <div class="t">${it.name}<span class="grade ${hi ? 'h' : 'n'}">${hi ? '高端' : '普通'}</span></div>
      <div class="s">${itemStats(it) ? itemStats(it) + '<br>' : ''}<span style="color:var(--dim)">${it.desc}</span></div>${btn}</div>`;
  }).join('');
  document.querySelectorAll('#items [data-a]').forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.id);
    if (b.dataset.a === 'buy') {
      const key = it.cur === 'gold' ? 'gold' : 'dia';
      if (S[key] < it.price) return toast(it.cur === 'gold' ? '金币不足' : '钻石不足');
      S[key] -= it.price; S.owned.push(it.id); S.equip[it.slot] = it.id; sfx('buy'); toast(`已购买并装备：${it.name}`);
    } else { S.equip[it.slot] = it.id; sfx('click'); toast(`已装备：${it.name}`); }
    save(); renderGarage(); refreshMoney();
  });
  const lo = loadout(), w = lo.weapon;
  $('#stats').innerHTML = [
    ['🎯 武器', itemById(S.equip.weapon).name], ['❤ 生命', lo.hp], ['🛡 减伤', Math.round(lo.red * 100) + '%'], ['✚ 回血', lo.regen + '/秒'],
    ['⚙ 速度', lo.spd], ['💥 秒伤', Math.round(w.dmg * (w.count || 1) * w.rate)], ['🔋 模块', itemById(S.equip.module).name],
  ].map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join('');
}
function drawPreview(time) {
  const pc = $('#preview'), c = pc.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pc.width, pc.height);
  c.strokeStyle = 'rgba(111,227,255,.25)'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(300, 215, 170, 55, 0, 0, 7); c.stroke();
  c.setTransform(3.2, 0, 0, 3.2, 300, 200);
  const lo = loadout();
  drawTank(c, { x: 0, y: 0, hull: -0.35, turret: -0.35 + Math.sin(time * 0.8) * 0.6, color: '#3d8bff', dark: '#1d4596', accent: '#6fe3ff', weapon: lo.weapon, trackPhase: time * 20, shield: 0, flash: 0, stun: 0 }, time);
}

function finishBattle(win) {
  const L = G.L;
  let gold = 0, dia = 0; const un = [];
  if (win) {
    gold = G.earned.gold; dia = G.earned.dia;
    if (G.reward.first) {
      S.cleared = Math.max(S.cleared, L);
      if (L < PLANETS.length) un.push(`🪐 新星球解锁：<span class="u">${PLANETS[L].name}</span>`);
      else if (L === PLANETS.length) un.push(`🌌 <span class="u">无尽深空模式</span> 已开启！`);
      else un.push(`🌌 解锁 <span class="u">深空 LV.${L + 1}</span>`);
      const items = ITEMS.filter(i => i.unlock === L);
      if (items.length) un.push(`🔧 新装备：${items.map(i => `<span class="u">${i.name}</span>${i.cur === 'dia' ? '💎' : ''}`).join('、')}`);
    }
    sfx('win');
  } else { gold = 20 + L * 15; sfx('lose'); }
  S.gold += gold; S.dia += dia; save();
  $('#rTitle').textContent = win ? '胜 利' : '战 败';
  $('#rTitle').className = win ? 'win' : 'lose';
  $('#rSub').textContent = win ? (G.reward.first ? `首次征服 ${G.P.name}！获得首通奖励` : `再次击败 ${G.enemy.name}`) : '别灰心，去车库强化装备再来！（获得安慰金币）';
  $('#rGold').textContent = '+' + gold; $('#rDia').textContent = '+' + dia;
  $('#rUnlocks').innerHTML = un.join('<br>');
  const next = win ? L + 1 : L;
  $('#rNext').textContent = win ? '⚔ 下一关' : '↻ 再来一次';
  $('#rNext').onclick = () => { sfx('click'); startBattle(Math.min(next, S.cleared + 1)); };
  G.state = 'over';
  show('result');
}
$('#rGarage').onclick = () => { sfx('click'); show('garage'); };
$('#rMap').onclick = () => { sfx('click'); show('map'); };
$('#toGarage').onclick = () => { initAudio(); sfx('click'); show('garage'); };
$('#backMap').onclick = () => { sfx('click'); show('map'); };
$('#reset').onclick = () => { if (confirm('确定要清空全部进度吗？')) { S = DEFAULT_SAVE(); save(); show('map'); } };

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const time = now / 1000;
  if (G && screen === 'battle' && !paused && G.state !== 'over') { update(dt); updateHud(); }
  if (screen === 'garage') drawPreview(time);
  render(time);
  requestAnimationFrame(loop);
}
show('map');
requestAnimationFrame(loop);
</script>
</body>
